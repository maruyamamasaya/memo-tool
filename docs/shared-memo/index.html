<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="グループでリアルタイムに共有できるメモアプリ">
    <title>Shared Memo</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./">Shared Memo</a>
      <div id="user-panel" class="user-panel" hidden>
        <div><strong id="user-name"></strong><span id="user-email"></span></div>
        <button id="logout-button" class="button button-quiet" type="button">ログアウト</button>
      </div>
    </header>

    <main class="page-shell">
      <div id="message" class="message" role="alert" aria-live="assertive" hidden></div>

      <section id="login-view" class="center-card">
        <h1>共有メモへようこそ</h1>
        <p>グループのメモを見るにはログインしてください。</p>
        <button id="login-button" class="button" type="button">Googleでログイン</button>
      </section>

      <section id="memo-view" hidden>
        <div class="section-heading">
          <div>
            <p id="group-name" class="eyebrow">共有グループ</p>
            <h1>共有メモ</h1>
          </div>
          <button id="add-button" class="button" type="button">＋ メモ追加</button>
        </div>
        <p id="loading" class="status">メモを読み込んでいます…</p>
        <p id="empty-state" class="empty-state" hidden>メモはまだありません。最初のメモを追加しましょう。</p>
        <div id="memo-list" class="memo-grid"></div>
      </section>
    </main>

    <dialog id="memo-dialog" aria-labelledby="dialog-title">
      <form id="memo-form" method="dialog">
        <div class="dialog-heading">
          <h2 id="dialog-title">メモ追加</h2>
          <button id="close-button" class="icon-button" type="button" aria-label="閉じる">×</button>
        </div>
        <label for="memo-title">タイトル</label>
        <input id="memo-title" name="title" maxlength="120" required>
        <label for="memo-body">本文</label>
        <textarea id="memo-body" name="body" rows="10" required></textarea>
        <div class="dialog-actions">
          <button id="delete-button" class="button button-danger" type="button" hidden>削除</button>
          <span class="action-spacer"></span>
          <button id="cancel-button" class="button button-quiet" type="button">キャンセル</button>
          <button id="save-button" class="button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
