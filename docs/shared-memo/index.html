<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="個人でも共有でも使える軽量メモアプリ"><title>Shared Memo V3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header"><a class="brand" href="./">Shared Memo</a><div id="user-panel" class="user-panel" hidden><div><strong id="user-name"></strong><span id="user-email"></span></div><button id="logout-button" class="button quiet" type="button">ログアウト</button></div></header>
<main class="page-shell">
  <div id="message" class="message" role="alert" aria-live="assertive" hidden></div>
  <section id="login-view" class="center-card"><h1>共有メモへようこそ</h1><p>グループのメモを見るにはログインしてください。</p><button id="login-button" class="button" type="button">Googleでログイン</button></section>
  <section id="memo-view" hidden>
    <div class="section-heading"><div><p id="group-name" class="eyebrow">共有グループ</p><h1 id="view-title">共有メモ</h1></div><button id="mobile-menu-button" class="button quiet mobile-only" type="button" aria-expanded="false">メニュー</button></div>
    <div class="search-wrap"><span aria-hidden="true">🔍</span><input id="search-input" type="search" placeholder="メモを検索..." aria-label="メモを検索"><button id="search-clear" class="text-button" type="button" hidden>クリア</button></div>
    <div class="workspace">
      <aside id="side-nav" class="side-nav">
        <div class="nav-heading"><button data-view="all" class="nav-section active">フォルダ</button><button id="add-folder-button" class="icon-small" title="フォルダ作成">＋</button></div><button data-view="folder" data-folder-id="none">未分類</button><div id="folder-list"></div>
        <div class="nav-heading"><strong>タグ</strong></div><div id="tag-list" class="tag-list"></div>
        <button data-view="trash">ゴミ箱</button><button id="settings-button">設定</button>
      </aside>
      <div class="content">
        <div class="toolbar"><button id="add-button" class="button">＋ 新規</button></div>
        <div id="bulk-actions" class="bulk-actions" hidden><strong id="selection-count"></strong><button id="bulk-trash" class="button danger" type="button">ゴミ箱に送る</button><button id="bulk-download" class="button quiet" type="button">ローカルに保存する</button><button id="bulk-cancel" class="text-button" type="button">キャンセル</button></div>
        <p id="active-filter" class="active-filter" hidden></p><p id="loading" class="status">メモを読み込んでいます…</p><p id="empty-state" class="empty-state" hidden>表示するメモはありません。</p><div id="memo-list" class="memo-list" aria-label="メモ一覧"></div>
      </div>
    </div>
  </section>
</main>
<dialog id="memo-dialog" class="editor-dialog"><form id="memo-form" method="dialog">
  <p class="editor-title">メモ編集中</p>
  <button id="close-button" class="editor-close" type="button" aria-label="エディターを閉じる">閉じる</button>
  <label class="sr-only" for="memo-editor">メモ（1行目はタイトル、最終行はタグ）</label>
  <textarea id="memo-editor" rows="18" maxlength="50000" placeholder="1行目にタイトルを入力&#10;&#10;本文を入力&#10;&#10;#タグ"></textarea>
  <div id="tag-suggestions" class="tag-suggestions" role="listbox" aria-label="タグ候補" hidden></div>
  <p id="autosave-status" class="autosave-status" role="status">入力すると自動保存されます</p>
</form></dialog>
<dialog id="viewer-dialog" class="viewer-dialog"><article class="viewer-panel"><div class="viewer-heading"><div><p id="viewer-type" class="eyebrow"></p><h2 id="viewer-title"></h2></div><button id="viewer-close-icon" class="icon-button" type="button" aria-label="閉じる">×</button></div><div id="viewer-body" class="viewer-body"></div><div id="viewer-meta" class="viewer-meta"></div><div class="viewer-actions"><span id="viewer-status" class="viewer-status" role="status"></span><button id="viewer-copy" class="button quiet" type="button">コピー</button><button id="viewer-close" class="button" type="button">閉じる</button></div></article></dialog>
<dialog id="folder-dialog" class="small-dialog"><form id="folder-form" class="panel"><div class="dialog-heading"><h2 id="folder-dialog-title">フォルダ作成</h2><button class="icon-button dialog-close" type="button">×</button></div><label>フォルダ名<input id="folder-name" maxlength="60" required></label><div class="dialog-actions"><button id="folder-delete-button" class="button danger" type="button" hidden>削除</button><span></span><button class="button" type="submit">保存</button></div></form></dialog>
<dialog id="settings-dialog" class="small-dialog"><div class="panel"><div class="dialog-heading"><h2>設定</h2><button class="icon-button dialog-close">×</button></div><p>テーマカラー</p><div id="theme-options" class="theme-options"><button data-theme="blue" style="--swatch:#2563eb">Blue</button><button data-theme="green" style="--swatch:#16835d">Green</button><button data-theme="purple" style="--swatch:#7c3aed">Purple</button><button data-theme="orange" style="--swatch:#d65a0b">Orange</button><button data-theme="red" style="--swatch:#c33131">Red</button><button data-theme="gray" style="--swatch:#52606d">Gray</button></div></div></dialog>
<script type="module" src="./app.js"></script>
</body></html>
